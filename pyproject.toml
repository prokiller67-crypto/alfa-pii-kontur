[project]
name = "alfa-pii-proxy"
version = "0.1.0"
description = "Local Russian PII detection and reversible masking for the Alfa hackathon"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "cryptography>=44",
  "redis>=5,<8",
  "prometheus-client>=0.21,<1",
  "regex>=2024.11.6",
  "natasha==1.6.0",
  "numpy<2",
  "pymorphy3>=2,<3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
    "ruff>=0.11",
    "fakeredis>=2.28",
    "aiohttp>=3.11,<4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pii_proxy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

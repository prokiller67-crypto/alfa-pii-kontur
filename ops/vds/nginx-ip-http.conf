# HTTP-01 bootstrap before requesting the IP certificate.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 195.209.210.68;
    access_log off;
    error_log /dev/null crit;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 308 https://195.209.210.68$request_uri;
    }
}

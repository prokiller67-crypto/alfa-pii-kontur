# Bootstrap HTTP site. Certbot adds TLS and HTTP-to-HTTPS redirection.
server {
    listen 80;
    listen [::]:80;
    server_name alfa-pii.195.209.210.68.sslip.io;

    access_log off;
    error_log /dev/null crit;
    server_tokens off;
    client_max_body_size 8000000;
    client_body_timeout 15s;

    location = / {
        return 302 /docs;
    }

    location / {
        proxy_pass http://alfa_pii_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_connect_timeout 2s;
        proxy_send_timeout 12s;
        proxy_read_timeout 12s;
        proxy_buffering off;
    }
}

name: Manual public API audit

on:
  workflow_dispatch:
    inputs:
      rate:
        description: Target HTTP requests per second (pairs arrive at half this rate)
        type: choice
        required: true
        default: '100'
        options: ['100', '150', '1000']
      text_mode:
        description: Unique inputs or six repeated texts (cache upper-bound diagnostic)
        type: choice
        required: true
        default: unique
        options: [unique, repeated]
      warmup_pairs:
        description: Concurrent warmup pairs before measurement (recorded separately)
        type: choice
        required: true
        default: '0'
        options: ['0', '128']

permissions:
  contents: read

concurrency:
  group: alfa-pii-public-audit
  cancel-in-progress: false

jobs:
  public-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      AUDIT_RATE: ${{ inputs.rate }}
      TEXT_MODE: ${{ inputs.text_mode }}
      WARMUP_PAIRS: ${{ inputs.warmup_pairs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install locked project dependencies
        run: |
          python -m pip install uv==0.11.25
          uv sync --frozen
          mkdir -p artifacts
      - name: Public mask and restore quality
        run: >-
          uv run python scripts/audit_quality.py --split holdout
          --url https://195.209.210.68 --output artifacts/quality.json
      - name: Five minute scheduled load with overload stop
        run: >-
          uv run python scripts/load_rate.py --url https://195.209.210.68
          --rate "$AUDIT_RATE" --seconds 300 --max-inflight 1024
          --text-mode "$TEXT_MODE"
          --warmup-pairs "$WARMUP_PAIRS"
          --output artifacts/load.json
      - name: Preserve results including unsuccessful runs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-api-audit-${{ inputs.rate }}-${{ inputs.text_mode }}
          path: artifacts/*.json
          retention-days: 7
          if-no-files-found: error
      - name: Verify quality and absence of load errors
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path
          quality = json.loads(Path('artifacts/quality.json').read_text())
          load = json.loads(Path('artifacts/load.json').read_text())
          assert quality['public'].get('expected_mask') == quality['cases'], 'public mask mismatch'
          assert quality['public'].get('exact_restore') == quality['cases'], 'public restore mismatch'
          assert load['clean_target_run'], 'load aborted or contained errors; inspect saved report'
          # Latency and the selected rate remain explicit in the report. A clean
          # run at 100 RPS does not claim the organizer's 1000 RPS acceptance.
          PY
